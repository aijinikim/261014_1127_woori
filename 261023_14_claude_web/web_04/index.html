<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비만계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <!-- 왼쪽: 키 눈금자 + 실루엣 -->
    <figure class="stage" id="stage" data-tone="normal">
      <svg class="stage-svg" viewBox="0 0 300 460" role="img" id="stage-svg" aria-label="체형 비교 그림">
        <defs>
          <!-- 몸통·팔·다리 (머리 제외). 220cm 기준 크기로 그림 -->
          <g id="body-shape">
            <rect x="172" y="70" width="16" height="22" rx="4" vector-effect="non-scaling-stroke"/>
            <path d="M138 94 C150 86 210 86 222 94 C228 120 226 180 216 246 L144 246 C134 180 132 120 138 94 Z" vector-effect="non-scaling-stroke"/>
            <rect x="116" y="96" width="18" height="150" rx="9" vector-effect="non-scaling-stroke"/>
            <rect x="226" y="96" width="18" height="150" rx="9" vector-effect="non-scaling-stroke"/>
            <rect x="146" y="236" width="30" height="204" rx="13" vector-effect="non-scaling-stroke"/>
            <rect x="184" y="236" width="30" height="204" rx="13" vector-effect="non-scaling-stroke"/>
          </g>
        </defs>

        <g class="ruler" id="ruler"></g>
        <line class="floor" x1="40" y1="440" x2="292" y2="440"/>

        <!-- 사용자 -->
        <g class="figure figure-user" id="user">
          <circle cx="180" cy="47" r="27"/>
          <g class="figure-body" id="user-body"><use href="#body-shape"/></g>
        </g>

        <!-- 기준: 같은 키, BMI 22 -->
        <g class="figure figure-ghost" id="ghost">
          <circle cx="180" cy="47" r="27" vector-effect="non-scaling-stroke"/>
          <g class="figure-body"><use href="#body-shape"/></g>
        </g>

        <g class="height-mark" id="height-mark">
          <line x1="40" x2="292" y1="0" y2="0"/>
          <text x="292" y="-6" text-anchor="end" id="height-mark-label"></text>
        </g>
      </svg>
      <figcaption class="legend">
        <span class="legend-item"><span class="swatch swatch-user"></span>나</span>
        <span class="legend-item"><span class="swatch swatch-ghost"></span>같은 키, BMI 22</span>
      </figcaption>
    </figure>

    <!-- 오른쪽: 입력 + 결과 -->
    <section class="panel">
      <header class="intro">
        <h1>비만계산기</h1>
        <p>키와 몸무게로 BMI를 계산하고 WHO 성인 기준으로 판정합니다.</p>
      </header>

      <form class="form" id="form" novalidate>
        <div class="field">
          <label for="height">키</label>
          <div class="input-wrap">
            <input id="height" name="height" type="number" inputmode="decimal" min="100" max="250" step="0.1" value="170" aria-describedby="height-error">
            <span class="unit">cm</span>
          </div>
          <p class="error" id="height-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="weight">몸무게</label>
          <div class="input-wrap">
            <input id="weight" name="weight" type="number" inputmode="decimal" min="20" max="300" step="0.1" value="65" aria-describedby="weight-error">
            <span class="unit">kg</span>
          </div>
          <p class="error" id="weight-error" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="age">나이</label>
          <div class="input-wrap">
            <input id="age" name="age" type="number" inputmode="numeric" min="1" max="120" step="1" value="30" aria-describedby="age-error">
            <span class="unit">세</span>
          </div>
          <p class="error" id="age-error" aria-live="polite"></p>
        </div>

        <fieldset class="field sex">
          <legend>성별</legend>
          <div class="segmented">
            <label><input type="radio" name="sex" value="male" checked><span>남성</span></label>
            <label><input type="radio" name="sex" value="female"><span>여성</span></label>
          </div>
        </fieldset>
      </form>

      <div class="result" id="result" aria-live="polite">
        <p class="bmi"><span class="bmi-label">BMI</span> <span class="bmi-value" id="bmi-value">—</span></p>
        <p class="category" id="category">키와 몸무게를 입력하세요</p>

        <dl class="facts">
          <div class="fact">
            <dt>정상 체중 범위</dt>
            <dd><span id="range">—</span> <span class="fact-note" id="range-gap"></span></dd>
          </div>
          <div class="fact">
            <dt>기초대사량</dt>
            <dd id="bmr">—</dd>
          </div>
        </dl>

        <ol class="scale" id="scale" aria-label="WHO BMI 기준">
          <li data-tone="under"><span>저체중</span><span>18.5 미만</span></li>
          <li data-tone="normal"><span>정상</span><span>18.5–24.9</span></li>
          <li data-tone="over"><span>과체중</span><span>25.0–29.9</span></li>
          <li data-tone="obese"><span>비만 1단계</span><span>30.0–34.9</span></li>
          <li data-tone="obese"><span>비만 2단계</span><span>35.0–39.9</span></li>
          <li data-tone="obese"><span>비만 3단계</span><span>40.0 이상</span></li>
        </ol>

        <p class="disclaimer">참고용이며 의학적 진단이 아닙니다.</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
