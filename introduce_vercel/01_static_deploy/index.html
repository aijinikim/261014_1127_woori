<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 Vercel 배포</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">Vercel 실습 01 · 정적 사이트</p>
    <h1>배포 성공!</h1>
    <p class="desc">이 페이지는 Claude Code가 <code>vercel</code> CLI로 배포했습니다.</p>

    <dl class="info">
      <div><dt>접속 주소</dt><dd id="host">-</dd></div>
      <div><dt>환경</dt><dd id="env">-</dd></div>
      <div><dt>현재 시각</dt><dd id="clock">-</dd></div>
    </dl>

    <button id="likeBtn" type="button">좋아요 <span id="likeCount">0</span></button>
  </main>
  <script src="script.js"></script>
</body>
</html>
