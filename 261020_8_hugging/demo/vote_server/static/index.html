<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HF 경진대회 투표</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .box { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 24px; text-align: center; margin: 0 0 6px; }
  h1 span { color: var(--accent); }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; font-size: 18px; padding: 12px; }
  .row button { font-size: 18px; padding: 12px 18px; }
  .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin: 16px 0; }
  .names button { padding: 16px 8px; font-size: 17px; }
  .names button.on { background: var(--accent); color: #1a1400; font-weight: 700; }
  .done { text-align: center; font-size: 20px; padding: 28px 16px; }
  .done b { color: var(--accent); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="box">
  <h1>🤗 HuggingFace 서비스 <span>경진대회</span></h1>
  <p class="sub">1인 1표 · 본인 투표 불가 · 투표 후 변경 불가</p>

  <!-- 1. 이름 입력 -->
  <form id="step1" class="panel">
    <label for="me" style="display:block;margin-bottom:8px">본인 이름을 입력하세요</label>
    <div class="row">
      <input id="me" placeholder="예) 홍길동" autocomplete="off" autofocus>
      <button class="primary">확인</button>
    </div>
  </form>

  <!-- 2. 투표 -->
  <div id="step2" class="panel hidden">
    <p style="margin:0"><b id="meName"></b> 님, 가장 좋았던 작품을 골라주세요.</p>
    <div class="names" id="names"></div>
    <div class="row">
      <button id="back">이름 다시 입력</button>
      <button class="primary" id="voteBtn" disabled style="flex:1">투표하기</button>
    </div>
  </div>

  <!-- 3. 완료 -->
  <div id="step3" class="panel done hidden"></div>

  <p style="text-align:center;margin-top:20px"><a class="badge" href="/result">🏆 결과 보기</a></p>
</div>

<script>
const $ = (id) => document.getElementById(id);
let me = null, pick = null;

function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function show(step) {
  ["step1", "step2", "step3"].forEach(s => $(s).classList.toggle("hidden", s !== step));
}

function showDone(target) {
  $("step3").innerHTML = "";
  const p = document.createElement("p"); p.style.margin = "0";
  const b = (t) => Object.assign(document.createElement("b"), { textContent: t });
  if (target) p.append("✅ ", b(me), " 님은 ", b(target), " 님에게 투표했습니다.");
  else p.append("✅ ", b(me), " 님은 이미 투표했습니다.");
  const s = document.createElement("p"); s.className = "muted"; s.style.marginBottom = "0";
  s.textContent = "결과 발표를 기다려주세요 🎉";
  const a = document.createElement("a"); a.className = "badge"; a.style.fontSize = "16px";
  a.href = "/result?me=" + encodeURIComponent(me); a.textContent = "📊 내 점수 보기";
  const wrap = document.createElement("p"); wrap.style.marginBottom = "0"; wrap.append(a);
  $("step3").append(p, s, wrap);
  show("step3");
}

$("step1").onsubmit = async (e) => {
  e.preventDefault();
  const name = $("me").value.trim();
  if (!name) return;
  try {
    const r = await api("/api/check?name=" + encodeURIComponent(name));
    me = r.name;
    if (r.voted) return showDone(null);
    const list = await api("/api/candidates");
    $("meName").textContent = me;
    $("names").innerHTML = "";
    pick = null; $("voteBtn").disabled = true;
    for (const n of list) {
      if (n === me) continue;
      const b = document.createElement("button");
      b.type = "button"; b.textContent = n;
      b.onclick = () => {
        pick = n;
        document.querySelectorAll(".names button").forEach(x => x.classList.toggle("on", x === b));
        $("voteBtn").disabled = false;
        $("voteBtn").textContent = `${n} 님에게 투표하기`;
      };
      $("names").appendChild(b);
    }
    show("step2");
  } catch (err) { toast(err.message); }
};

$("back").onclick = () => { me = null; $("voteBtn").textContent = "투표하기"; show("step1"); };

$("voteBtn").onclick = async () => {
  if (!pick || !confirm(`${pick} 님에게 투표할까요?\n투표 후에는 바꿀 수 없습니다.`)) return;
  try {
    const r = await api("/api/vote", { method: "POST", body: JSON.stringify({ name: me, target: pick }) });
    showDone(r.voted_for);
  } catch (err) { toast(err.message); }
};
</script>
</body>
</html>
